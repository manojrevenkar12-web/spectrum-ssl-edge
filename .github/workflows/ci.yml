name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint, tests, release gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - name: Unit tests (signals, metrics, int8, Rust parity, scenes, protocol)
        run: pytest -m "not slow"
      - name: Release gate on the committed full run
        run: sse gate --profile full

  pipeline:
    name: pipeline end to end (quick profile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip }
      - run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest -m slow
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: quick-run, path: 'runs/quick/*.json' }

  rust:
    name: rust runtime (fmt, clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run: { working-directory: edge-rs }
    steps:
      - uses: actions/checkout@v5
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests (bit-exact parity and spectrum front end against committed fixtures)
        run: cargo test --release
      - name: Benchmark on the committed fixture
        run: cargo run --release --quiet -- bench tests/fixtures/model.bin tests/fixtures/vectors.bin 2000

  web:
    name: results explorer (lint, types, unit, build, browser + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
